limit_req_zone $binary_remote_addr zone=timeline_limit:10m rate=1r/m;

server {
    listen 80;
    server_name ye-chan-lin.duckdns.org;

    if ($host = ye-chan-lin.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ye-chan-lin.duckdns.org;

    location /api/timeline_post {
        limit_req zone=timeline_limit burst=0 nodelay;
        proxy_pass http://myportfolio:5000/api/timeline_post;
    }

    location / {
        proxy_pass http://myportfolio:5000/;
    }

    # Load the certificate files.
    ssl_certificate /etc/letsencrypt/live/ye-chan-lin.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ye-chan-lin.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ye-chan-lin.duckdns.org/chain.pem;
}